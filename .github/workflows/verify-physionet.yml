# The data platform's adversarial suite, on the open demo: no credentials, no credentialed data.
# Mutations run locally (make verify-physionet); here the checks themselves guard each push.
name: verify-physionet

on:
  push:
    branches: [main]
    paths:
      - 'backend/ml/physionet/**'
      - 'backend/ml/mimic/**'
      - 'verify_physionet.py'
      - '.github/workflows/verify-physionet.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install
        run: |
          pip install --disable-pip-version-check numpy==2.0.2 scipy==1.13.1 pandas==2.3.3 scikit-learn==1.6.1 joblib==1.5.3 lightgbm==4.6.0 certifi -r backend/ml/physionet/requirements.txt
          pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch the open demo, verified
        run: PYTHONPATH=. python -W ignore -c "from backend.ml.physionet import pipeline; pipeline.fetch_demo('demo')"
      - name: Verify
        env:
          MIMIC_DEMO_ROOT: demo
          PHYSIONET_LAKE: /tmp/physionet-lake
        run: PYTHONPATH=. python -W ignore verify_physionet.py --no-mutations
