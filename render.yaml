# Render blueprint for the AegisOS / HyperSepsisTwin-Ω backend.
# Render supports persistent processes + WebSockets (Vercel does not), so the live
# FastAPI server — the /aegis/stream WebSocket, the simulator/risk brain, and the
# real-data ingest + Supabase persistence — runs here. The clinical app
# (frontend/, Cloudflare Pages) points at this service's URL through
# NEXT_PUBLIC_AEGIS_BACKEND; see deploy/README.md.
#
# Deploy: render.com → New → Blueprint → connect this GitHub repo. Then set the
# secret env vars (SUPABASE_URL, SUPABASE_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY)
# in the dashboard.
#
# The AI-doctor consult call relays its realtime audio WebSocket through this
# service, which is the reason the credential lives here and not in the static
# frontend: Gemini's ephemeral auth tokens are rejected by the Live socket, so a
# browser-direct design would have to publish the key.
services:
  - type: web
    name: sepsis-backend
    runtime: python
    plan: free                       # free tier supports WebSockets; sleeps after 15 min idle
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.aegis.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /aegis/health
    # Don't redeploy the backend for frontend-only commits. Every redeploy
    # re-runs pip install and re-pulls the 7.7 MB model against a free-tier
    # budget the keep-warm workflow already documents as tight. The marketing
    # site (site/), the clinical app (frontend/) and the legacy shell (webui/)
    # are all served elsewhere.
    buildFilter:
      ignoredPaths:
        - "site/**"
        - "webui/**"
        - "frontend/**"
        - "docs/**"
        - "**/*.md"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL            # set in dashboard (secret) — same project as backend/.env
        sync: false
      - key: SUPABASE_KEY            # service-role key — set in dashboard, never committed
        sync: false
      - key: GEMINI_API_KEY          # primary LLM + the AI-doctor voice call; set in dashboard
        sync: false
      - key: OPENROUTER_API_KEY      # text-only backup provider (Nemotron); set in dashboard
        sync: false
